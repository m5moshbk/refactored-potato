name: Integration contract checks

on:
  push:
    branches:
      - "integration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nexus-integration-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Validate integration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sada-voice/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r sada-voice/backend/requirements.txt

      - name: Run integration contract tests
        run: python -m unittest discover -s tests -p "test_integration_contract_examples.py" -v
