name: Nexus inventory and Salla control API tests

on:
  push:
    branches:
      - fix/nexus-inventory-api-validation
      - feat/salla-webhook-gateway-20261112
  pull_request:
    paths:
      - "inventory_api/**"
      - "salla-control-center/**"
      - "salla_control_api/**"
      - ".github/workflows/inventory-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inventory dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r inventory_api/requirements.txt pytest
      - name: Run inventory and webhook gateway tests
        run: python -m pytest -q inventory_api/tests

  salla-control-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Salla control API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r salla_control_api/requirements.txt pytest
      - name: Run Salla Partner event tests
        run: python -m pytest -q salla_control_api/tests
