name: Nexus Google Drive MOCK Connector

on:
  push:
    paths:
      - "M5mOsH_NEXUS_GOOGLE_DRIVE_CONNECTOR/**"
      - ".github/workflows/nexus-google-drive-mock.yml"
  pull_request:
    paths:
      - "M5mOsH_NEXUS_GOOGLE_DRIVE_CONNECTOR/**"
      - ".github/workflows/nexus-google-drive-mock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: M5mOsH_NEXUS_GOOGLE_DRIVE_CONNECTOR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
