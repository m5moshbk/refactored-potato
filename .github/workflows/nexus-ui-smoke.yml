name: Nexus UI smoke tests

on:
  push:
    branches:
      - feat/nexus-ui-comprehensive-20261110
      - feat/nexus-owner-repair-inbox-20261110
    paths:
      - "index.html"
      - "design-system.html"
      - "project-catalog.json"
      - "scripts-catalog.json"
      - "tests/test_nexus_ui.py"
      - ".github/workflows/nexus-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-contract:
    name: Static UI and accessibility contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Nexus UI checks
        run: python -m unittest discover -s tests -p "test_nexus_ui.py" -v
      - name: Prepare branch preview bundle
        run: |
          mkdir -p build/nexus-ui-preview
          cp index.html design-system.html project-catalog.json scripts-catalog.json build/nexus-ui-preview/
          printf '%s\n' 'M5mOsH Nexus branch preview' '' 'Extract this folder, open a terminal inside it, then run: python -m http.server 8000' 'Open http://127.0.0.1:8000/index.html for the Nexus home page.' 'Open http://127.0.0.1:8000/design-system.html for the design studio.' 'Keep project-catalog.json and scripts-catalog.json beside the HTML files; the page loads them with fetch, so use HTTP instead of double-clicking a file:// URL.' 'Stop the local preview with Ctrl+C. This is a local preview bundle from the development branch; it is not a deployment.' '© M5mOsH All Rights Reserved' > build/nexus-ui-preview/README.txt
      - name: Upload branch preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: m5mosh-nexus-ui-preview
          path: build/nexus-ui-preview/
          if-no-files-found: error
          retention-days: 7
