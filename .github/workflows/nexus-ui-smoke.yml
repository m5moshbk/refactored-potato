name: Nexus UI smoke tests

on:
  push:
    branches:
      - feat/nexus-ui-comprehensive-20261110
    paths:
      - "index.html"
      - "design-system.html"
      - "tests/test_nexus_ui.py"
      - ".github/workflows/nexus-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-contract:
    name: Static UI and accessibility contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/nexus-ui-comprehensive-20261110
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Nexus UI checks
        run: python -m unittest discover -s tests -p "test_nexus_ui.py" -v
