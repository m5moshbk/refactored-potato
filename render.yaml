services:
  - type: web
    name: m5mosh-voice-nexus-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: sada-voice/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: VOICE_IDENTITY_ENABLED
        value: "false"
      - key: SPEECH_PROVIDER
        value: browser
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
